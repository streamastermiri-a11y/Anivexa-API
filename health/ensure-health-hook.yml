name: Re-apply /health hook after sync

# Runs after any push that changes index.js (that's what "Sync fork" does) and
# on demand from the Actions tab. If the sync removed the /health hook, this
# puts it back, runs the tests, and only commits when they pass. If it can't
# fix things safely, the run fails and GitHub emails you.

on:
  push:
    branches: [main]
    paths:
      - index.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-hook
  cancel-in-progress: false

jobs:
  ensure-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-add the hook if the sync removed it
        run: node health/ensure-hook.js

      - name: Verify before committing
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node --test health/health.test.js

      - name: Commit the fix (only if something changed)
        run: |
          if git diff --quiet -- index.js; then
            echo "index.js unchanged: the hook was already intact."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.js
            git commit -m "fix(health): re-apply /health hook after upstream sync"
            git push
          fi
